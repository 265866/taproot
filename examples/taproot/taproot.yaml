# Taproot settings. Taproot reads this file from beside config.yaml, or from
# the path in TAPROOT_CONFIG. The dashboard's Access page edits the device and
# address lists in place, and its Settings page edits retention, the backup
# schedule, and alerts.
access:
  # Each device's permissions, by its Tailscale stable ID (`tailscale status
  # --json` shows it as ID; the Access page shows it too). proxy: true sends
  # model requests through taproot. admin: true opens the dashboard and the
  # management API, which hold your OAuth tokens. A device that is not listed
  # has neither, and the server's own node always has Proxy and never Admin.
  # Taproot keeps each name in step with the tailnet, and forgets a device
  # 24 hours after it leaves the tailnet. While no device has admin: true,
  # taproot logs a setup code at each start, and the first tailnet device to
  # enter it on the dashboard gets Proxy and Admin.
  devices:
    - id: nEXAMPLE1CNTRL
      name: laptop
      proxy: true
      admin: true
  # Addresses outside Tailscale that may use the proxy, never the dashboard.
  # Use single host-local addresses, such as the LAN address a 127.0.1.1
  # publish arrives from, never a whole LAN.
  # addresses:
  #   - cidr: 192.0.2.20/32
  #     note: agents on the server host
  # tailscale-socket: /var/run/tailscale/tailscaled.sock
backups:
  # Local time, HH:MM, in the container's TZ. "off" disables the schedule.
  daily-at: "00:00"
  keep: 14
request-logs:
  max-days: 14
  max-bytes: 20GiB
# alerts:
#   discord-webhook: https://discord.com/api/webhooks/<id>/<token>
