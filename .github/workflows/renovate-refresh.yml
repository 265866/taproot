name: renovate-refresh

# Renovate's hosted app cannot run post-upgrade commands, so a Renovate pull
# request that changes a lockfile or the image's RUST_VERSION leaves the files
# generated from them stale: nix/vendor-hash and web/bun.nix (CI's nix-hashes
# job) and THIRD_PARTY_NOTICES.md (CI's notices job, which records the Rust
# version). This workflow regenerates them,
# pushes them to the pull request's branch, and starts CI for the new head.
#
# It cannot loop: GitHub starts no workflow for a push made with the workflow
# token, so the push does not trigger this workflow again, and the CI run it
# starts with workflow_dispatch pushes nothing. renovate.json lists the commit
# author in gitIgnoredAuthors, so Renovate keeps updating the branch.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - go.sum
      - web/bun.lock
      - internal/taproot/reqlog/codec/native/Cargo.lock
      - flake.lock
      - Containerfile.taproot

permissions: {}

concurrency:
  group: renovate-refresh-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Runs the pull request's code to regenerate the files, without write access.
  generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'renovate/') &&
      github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
      # The image's Rust toolchain, as in CI's notices job.
      - run: |
          rust_version="$(sed -n 's/^ARG RUST_VERSION=//p' Containerfile.taproot)"
          rustup toolchain install "$rust_version" --profile minimal && rustup default "$rust_version"
      - run: scripts/taproot/nix-refresh.sh
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun scripts/taproot/third-party-notices.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refreshed
          path: |
            nix/vendor-hash
            web/bun.nix
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 1

  # Commits the regenerated files and starts CI. Runs none of the pull
  # request's code. The push fails if Renovate pushed again in the meantime;
  # that push starts a new run.
  push:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refreshed
          path: ${{ runner.temp }}/refreshed
      - name: Commit, push, and start CI
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REFRESHED: ${{ runner.temp }}/refreshed
        run: |
          files=(nix/vendor-hash web/bun.nix THIRD_PARTY_NOTICES.md)
          for f in "${files[@]}"; do cp "$REFRESHED/$f" "$f"; done
          if git diff --quiet -- "${files[@]}"; then
            echo "The generated files are current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m 'chore(deps): refresh nix hashes and third-party notices' -- "${files[@]}"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          # A rerun cannot recover a failed dispatch, because its push of the
          # same base is rejected, so retry here.
          for attempt in 1 2 3; do
            if gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::error::Pushed the refresh but could not start CI. Run: gh workflow run ci.yml --ref $HEAD_REF"
          exit 1
