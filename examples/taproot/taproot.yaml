# Taproot settings. Taproot reads this file from beside config.yaml, or from
# the path in TAPROOT_CONFIG. The dashboard's Settings page edits the access
# lists, retention, backup schedule, and alerts in place.
access:
  # Tailscale logins that may use the proxy. List every login explicitly.
  # `tailscale whois <ip>` or `tailscale status --json` shows a login.
  allow-logins:
    - alice@example.com
  # Devices that may also use the dashboard and the management API, which
  # hold your OAuth tokens. Pin each device by stable node ID ("id:" plus
  # the ID from `tailscale status --json`). The server's own node is never
  # an admin. With this list empty, only loopback inside the container is.
  admin-nodes:
    - id:nEXAMPLE1CNTRL
  # tailscale-socket: /var/run/tailscale/tailscaled.sock
backups:
  # Local time, HH:MM, in the container's TZ. "off" disables the schedule.
  daily-at: "00:00"
  keep: 14
request-logs:
  max-days: 14
  max-bytes: 20GiB
# alerts:
#   discord-webhook: https://discord.com/api/webhooks/<id>/<token>
