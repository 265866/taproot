name: release-please

# On every push to main, release-please opens or updates the release PR, which
# bumps the version in .github/.release-please-manifest.json and adds the
# release's section to CHANGELOG.md from Conventional Commit messages. When the
# push merged that PR, it tags taproot-vX.Y.Z on the merge commit and creates
# a draft release instead, and the release job builds and publishes it. A tag
# created with GITHUB_TOKEN starts no workflow, so the tag's push event never
# runs release.yml; this workflow calls it.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  release:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    # The most release.yml's jobs ask for; each job takes only its own.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
