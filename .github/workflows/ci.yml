name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./internal/taproot/... ./internal/api/... ./sdk/cliproxy/... ./cmd/...

  # The request-log codec library: Rust checks, then request logs and the codec
  # package built with the taproot_codecs tag against it, as the image builds
  # them. The go job above covers the stub build.
  codec:
    runs-on: ubuntu-latest
    env:
      # Matches RUST_VERSION in Containerfile.taproot.
      RUST_VERSION: "1.99"
    defaults:
      run:
        working-directory: internal/taproot/reqlog/codec/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Rust version matches the image
        run: grep -qx "ARG RUST_VERSION=$RUST_VERSION" "$GITHUB_WORKSPACE/Containerfile.taproot"
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy && rustup default "$RUST_VERSION"
      - run: cargo fmt --check
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - run: go vet -tags taproot_codecs ./...
        working-directory: internal/taproot/reqlog
      - run: go test -race -tags taproot_codecs ./...
        working-directory: internal/taproot/reqlog

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f Containerfile.taproot .
