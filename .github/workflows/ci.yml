name: ci

on:
  # A pull request runs once, from pull_request; push covers main only.
  push:
    branches: [main]
  pull_request:
  # renovate-refresh.yml starts a run this way for the commit it pushes to a
  # Renovate branch, which the workflow token's push does not trigger.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go version matches the image
        run: grep -qx "ARG GO_VERSION=$(go env GOVERSION | sed 's/^go//')" Containerfile.taproot
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 "$(go env GOROOT)/bin/gofmt" -l)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt -w on:\n%s\n' "$unformatted"
            exit 1
          fi
      # Fails on an upstream file changed since the last upstream snapshot
      # that DESIGN.md's "Upstream boundary" section does not name.
      - run: scripts/taproot/check-upstream-boundary.sh
      # Upstream's TestAdvertiserAndBrowser_Integration needs real mDNS
      # multicast, which runners do not have.
      - run: go test -skip '^TestAdvertiserAndBrowser_Integration$' ./...
      # .golangci.yml limits reports to taproot-owned code.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # The request-log codec library: Rust checks, then request logs and the codec
  # package built with the taproot_codecs tag against it, as the image builds
  # them. The go job above covers the stub build.
  codec:
    runs-on: ubuntu-latest
    env:
      # Matches RUST_VERSION in Containerfile.taproot.
      RUST_VERSION: "1.99"
    defaults:
      run:
        working-directory: internal/taproot/reqlog/codec/native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Rust version matches the image
        run: grep -qx "ARG RUST_VERSION=$RUST_VERSION" "$GITHUB_WORKSPACE/Containerfile.taproot"
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy && rustup default "$RUST_VERSION"
      - run: cargo fmt --check
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - run: go vet -tags taproot_codecs ./...
        working-directory: internal/taproot/reqlog
      - run: go test -race -tags taproot_codecs ./...
        working-directory: internal/taproot/reqlog

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify

  # THIRD_PARTY_NOTICES.md must match what its generator writes from go.mod,
  # web/bun.lock, the codec's Cargo.lock, and licenses/.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
      # The image's Rust toolchain; the generator reads the standard library's
      # license texts from it and runs cargo metadata.
      - run: |
          rust_version="$(sed -n 's/^ARG RUST_VERSION=//p' Containerfile.taproot)"
          rustup toolchain install "$rust_version" --profile minimal && rustup default "$rust_version"
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun test scripts/taproot/ internal/taproot/demo/
      - run: bun scripts/taproot/third-party-notices.ts
      - run: git diff --exit-code THIRD_PARTY_NOTICES.md

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f Containerfile.taproot -t taproot-ci .
      # The licenses and notices the image must ship with the binary.
      - run: >-
          docker run --rm --entrypoint ls taproot-ci
          /taproot/LICENSE /taproot/THIRD_PARTY_NOTICES.md /taproot/web/LICENSE
          /taproot/licenses/LGPL-3.0.txt /taproot/licenses/GPL-3.0.txt

  # The flake's packages and the NixOS VM test (checks in flake.nix). Builds
  # for x86_64-linux; aarch64-linux is evaluated only.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix flake check -L

  # nix/vendor-hash and web/bun.nix follow go.sum and web/bun.lock. This job
  # fails with the diff when they are stale; run scripts/taproot/nix-refresh.sh
  # and commit the result. It does not push the fix itself: a commit pushed
  # with the workflow token starts no CI run, so that head would go unchecked.
  # On Renovate's branches, renovate-refresh.yml pushes the fix and starts a
  # run for it.
  nix-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: scripts/taproot/nix-refresh.sh
      - name: Hashes are current
        run: |
          if ! git diff --exit-code -- nix/vendor-hash web/bun.nix; then
            echo "::error::nix/vendor-hash or web/bun.nix is stale. Run scripts/taproot/nix-refresh.sh and commit the result."
            exit 1
          fi
